name: CI

on:
  push:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:

  backend:
    name: Backend - Maven
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        run: ./mvnw test -B


  ai-service:
    name: AI Service - Pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install AI service dependencies
        run: pip install -r requirements.txt

      - name: Install pytest
        run: pip install pytest==9.1.1

      - name: Run AI service tests
        run: pytest -q


  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_BASE_URL: http://localhost:8081
        run: npm run build


  ml-api:
    name: ML API - Environment Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: data-science

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            data-science/requirements-ml.txt
            data-science/requirements-inference.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install inference dependencies
        run: pip install -r requirements-inference.txt

      - name: Verify ML dependencies
        run: |
          python -c "import numpy; print('numpy:', numpy.__version__)"
          python -c "import pandas; print('pandas:', pandas.__version__)"
          python -c "import scipy; print('scipy:', scipy.__version__)"
          python -c "import sklearn; print('scikit-learn:', sklearn.__version__)"
          python -c "import xgboost; print('xgboost:', xgboost.__version__)"
          python -c "import joblib; print('joblib:', joblib.__version__)"
          python -c "import fastapi; print('fastapi:', fastapi.__version__)"

      - name: Check inference API Python syntax
        run: python -m compileall -q inference_api


  compose:
    name: Docker Compose - Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI-only AI environment file
        run: |
          printf 'OPENAI_API_KEY=ci-placeholder\n' > ai-service/.env

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Show Compose services
        run: docker compose config --services
