name: Docker E2E

on:
  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:

  docker-e2e:
    name: Full Stack - Docker E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:

      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Verify Git LFS ML artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "Git LFS files:"
          git lfs ls-files

          mapfile -t artifacts < <(
            find data-science/artifacts \
              -maxdepth 1 \
              -type f \
              -name '*.joblib' \
              -print
          )

          if [ "${#artifacts[@]}" -lt 3 ]; then
            echo "Expected at least 3 ML joblib artifacts."
            exit 1
          fi

          for artifact in "${artifacts[@]}"; do
            size="$(stat -c%s "$artifact")"

            echo "$artifact -> $size bytes"

            if [ "$size" -lt 100000 ]; then
              echo "Artifact looks like an LFS pointer or incomplete file: $artifact"
              exit 1
            fi
          done

          echo "ML artifacts downloaded successfully."

      - name: Create CI-only AI environment
        shell: bash
        run: |
          printf 'OPENAI_API_KEY=\n' > ai-service/.env

      - name: Prepare ephemeral E2E admin credentials
        shell: bash
        run: |
          set -euo pipefail

          admin_email='e2e-admin@example.invalid'
          admin_password="$(openssl rand -hex 24)"

          printf '::add-mask::%s\n' "$admin_password"
          printf 'APP_ADMIN_EMAIL=%s\n' "$admin_email" >> "$GITHUB_ENV"
          printf 'APP_ADMIN_PASSWORD=%s\n' "$admin_password" >> "$GITHUB_ENV"

          echo "Ephemeral CI admin credentials prepared."

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build full application stack
        run: docker compose build

      - name: Start full application stack
        run: docker compose up -d

      - name: Wait for application services
        shell: bash
        run: |
          set -euo pipefail

          wait_for_url() {
            local name="$1"
            local url="$2"

            echo "Waiting for $name -> $url"

            for attempt in $(seq 1 90); do
              if curl \
                --fail \
                --silent \
                --show-error \
                "$url" \
                > /dev/null; then

                echo "$name is ready."
                return 0
              fi

              echo "$name not ready yet ($attempt/90)"
              sleep 2
            done

            echo "$name failed to become ready."
            docker compose ps
            return 1
          }

          wait_for_url \
            "ML API" \
            "http://127.0.0.1:8000/health"

          wait_for_url \
            "AI Advisor" \
            "http://127.0.0.1:8100/health"

          wait_for_url \
            "Spring Backend" \
            "http://127.0.0.1:8081/actuator/health"

          wait_for_url \
            "Frontend" \
            "http://127.0.0.1:5173/"

      - name: Show Docker Compose status
        run: docker compose ps

      - name: Verify ML API health
        shell: bash
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8000/health

          echo

      - name: Verify AI Advisor health
        shell: bash
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8100/health

          echo

      - name: Verify Spring Boot health
        shell: bash
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8081/actuator/health

          echo

      - name: Verify frontend HTTP response
        shell: bash
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:5173/ \
            > /dev/null

          echo "Frontend responded successfully."

      - name: Authenticate E2E admin and export JWT
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $body = @{
            email = $env:APP_ADMIN_EMAIL
            password = $env:APP_ADMIN_PASSWORD
          } | ConvertTo-Json -Compress

          $session = Invoke-RestMethod `
            -Uri 'http://127.0.0.1:8081/api/auth/login' `
            -Method Post `
            -ContentType 'application/json' `
            -Body $body `
            -TimeoutSec 20

          if (
            [string]::IsNullOrWhiteSpace($session.accessToken) -or
            $session.user.role -ne 'ADMIN' -or
            $session.user.enabled -ne $true
          ) {
            throw 'CI admin authentication failed.'
          }

          Write-Host "::add-mask::$($session.accessToken)"

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "BACKEND_ACCESS_TOKEN=$($session.accessToken)" `
            -Encoding utf8

          Write-Host '[PASS] E2E admin authenticated.'
          Write-Host '[PASS] JWT exported securely.'

      - name: Run ML integration tests
        shell: pwsh
        run: |
          ./backend/scripts/verify-ml-integration.ps1 `
            -BaseUrl http://127.0.0.1:8081

      - name: Run business API integration tests
        shell: pwsh
        run: |
          ./backend/scripts/verify-business-api.ps1 `
            -BaseUrl http://127.0.0.1:8081

      - name: Run Advisor deterministic fallback E2E tests
        shell: pwsh
        run: |
          ./backend/scripts/verify-advisor-fallback.ps1 `
            -BaseUrl http://127.0.0.1:8081

      - name: Show container logs
        if: always()
        shell: bash
        run: |
          docker compose ps || true
          docker compose logs \
            --no-color \
            --tail=250 || true

      - name: Stop application stack
        if: always()
        shell: bash
        run: |
          docker compose down \
            -v \
            --remove-orphans || true

          rm -f ai-service/.env
