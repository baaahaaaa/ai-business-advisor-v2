name: Publish AI Service Image

on:
  workflow_dispatch:

  push:
    branches:
      - feature/cloud-deployment
    paths:
      - "ai-service/**"
      - ".github/workflows/publish-ai-service-image.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: baaahaaaa/ai-business-advisor-v2-ai-service

jobs:
  publish-ai-service-image:
    name: Publish AI Service Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AI service image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/baaahaaaa/ai-business-advisor-v2-ai-service:cloud-deployment
            ghcr.io/baaahaaaa/ai-business-advisor-v2-ai-service:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/baaahaaaa/ai-business-advisor-v2
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service
