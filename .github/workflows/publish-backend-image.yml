name: Publish Backend Image

on:
  workflow_dispatch:

  push:
    branches:
      - feature/cloud-deployment
    paths:
      - "backend/**"
      - ".github/workflows/publish-backend-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish-backend-image:
    name: Publish Backend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/baaahaaaa/ai-business-advisor-v2-backend:cloud-deployment
            ghcr.io/baaahaaaa/ai-business-advisor-v2-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/baaahaaaa/ai-business-advisor-v2
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
