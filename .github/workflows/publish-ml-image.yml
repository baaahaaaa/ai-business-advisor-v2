name: Publish ML API Image

on:
  workflow_dispatch:

  push:
    branches:
      - feature/cloud-deployment
    paths:
      - "data-science/**"
      - ".github/workflows/publish-ml-image.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: baaahaaaa/ai-business-advisor-v2-ml-api

jobs:
  publish-ml-image:
    name: Publish ML API Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Verify ML model artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Git LFS model artifacts..."

          mapfile -t artifacts < <(
            find data-science/artifacts \
              -type f \
              -name "*.joblib" \
              -print
          )

          echo "Found ${#artifacts[@]} joblib artifact(s)."

          if [ "${#artifacts[@]}" -lt 3 ]; then
            echo "ERROR: Expected at least 3 ML model artifacts."
            exit 1
          fi

          for artifact in "${artifacts[@]}"; do
            size=$(stat -c%s "$artifact")

            echo "$artifact -> $size bytes"

            if [ "$size" -le 100000 ]; then
              echo "ERROR: $artifact looks like a Git LFS pointer or invalid artifact."
              exit 1
            fi
          done

          echo "ML model artifacts verified."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ML API image
        uses: docker/build-push-action@v6
        with:
          context: ./data-science
          file: ./data-science/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/baaahaaaa/ai-business-advisor-v2-ml-api:cloud-deployment
            ghcr.io/baaahaaaa/ai-business-advisor-v2-ml-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/baaahaaaa/ai-business-advisor-v2
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ml-api
          cache-to: type=gha,mode=max,scope=ml-api
