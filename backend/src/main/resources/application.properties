spring.application.name=backend

server.port=${PORT:8080}

ml-api.base-url=${ML_API_BASE_URL:http://127.0.0.1:8000}
ml-api.request-timeout-seconds=${ML_API_REQUEST_TIMEOUT_SECONDS:90}

advisor-api.base-url=${ADVISOR_API_BASE_URL:http://127.0.0.1:8100}
advisor-api.request-timeout-seconds=${ADVISOR_API_REQUEST_TIMEOUT_SECONDS:90}

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

management.endpoints.web.exposure.include=health

# PostgreSQL / persistence
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/ai_business_advisor}
spring.datasource.username=${DATABASE_USERNAME:ai_business_advisor}
spring.datasource.password=${DATABASE_PASSWORD:ai_business_advisor_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT security
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.jwt.issuer=${JWT_ISSUER:ai-business-advisor}

# Admin bootstrap
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.first-name=${APP_ADMIN_FIRST_NAME:Admin}
app.admin.last-name=${APP_ADMIN_LAST_NAME:User}

